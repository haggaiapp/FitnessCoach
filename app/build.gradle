plugins {
    id 'com.android.application'
}

android {
    namespace 'il.fitcoach.app'
    compileSdk 34

    defaultConfig {
        applicationId "il.fitcoach.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // לחתימה: Build > Generate Signed Bundle / APK ב-Android Studio
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions {
        // לא לדחוס קבצי ווב
        noCompress 'html', 'js', 'css', 'webmanifest'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}
